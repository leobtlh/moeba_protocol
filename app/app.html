        const parseFrenchDate = (dateStr) => {
            if (!dateStr || dateStr === "En attente") return null;

             const monthMap = {
                'Janvier': 'January', 'Février': 'February', 'Mars': 'March',
                'Avril': 'April', 'Mai': 'May', 'Juin': 'June',
                'Juillet': 'July', 'Août': 'August', 'Septembre': 'September',
                'Octobre': 'October', 'Novembre': 'November', 'Décembre': 'December'
            };

            let dateToParse = dateStr;
            Object.keys(monthMap).forEach(fr => {
                if(dateStr.includes(fr)) {
                    dateToParse = dateStr.replace(fr, monthMap[fr]);
                }
            });
            return new Date(dateToParse);

        // --- APP COMPONENT ---
        function App() {
          const [activeRole, setActiveRole] = useState('investor');

          const [actionTab, setActionTab] = useState('deposit'); // 'deposit' | 'withdraw'

          // FILTRES & TRI
          const [selectedChains, setSelectedChains] = useState([]);
          const [searchQuery, setSearchQuery] = useState('');
          const [aprSort, setAprSort] = useState('neutral');

          // --- MODE LISTE / GRILLE ---
          const [viewMode, setViewMode] = useState('grid');

          const [isLiveMode, setIsLiveMode] = useState(false);

          const [isFormExpanded, setIsFormExpanded] = useState(false);

          const [isDarkMode, setIsDarkMode] = useState(false);
          const [notification, setNotification] = useState({ message: '', type: 'info' });

          // State for wallet dropdown menu
          const [showWalletMenu, setShowWalletMenu] = useState(false);

          const showNotification = (msg, type = 'info') => {
              setNotification({ message: msg, type });
              setTimeout(() => {
                  setNotification(prev => prev.message === msg ? { message: '', type: 'info' } : prev);
              }, 4000);
          };

          // --- LOGIQUE DE VÉRIFICATION WHITELIST & STATUS DEMANDE (DU BACKUP) ---
          useEffect(() => {
              const checkWhitelistStatus = async () => {
                  if (!walletConnected || !userFullAddress) {
                      setIsInsurerWhitelisted(false);
                      setRegistrationStatus('none');
                      return;
                  }

                  if (isLiveMode) {
                      // VERIFICATION ON-CHAIN (MODE LIVE)
                      try {
                          const provider = new window.ethers.providers.Web3Provider(window.ethereum);

                          if (FACTORY_ADDRESS_LIVE === "0x0000000000000000000000000000000000000000") {
                              // Mode démo sans contrat déployé
                              setIsInsurerWhitelisted(false);
                              return;
                          }

                          const factoryContract = new window.ethers.Contract(FACTORY_ADDRESS_LIVE, FACTORY_ABI_EXTENDED, provider);
                          const isWhitelisted = await factoryContract.isWhitelistedInsurer(userFullAddress);
                          setIsInsurerWhitelisted(isWhitelisted);

                          // Si pas whitelisté, on vérifie s'il y a une demande en attente
                          if (!isWhitelisted) {
                              try {
                                const request = await factoryContract.insurerRequests(userFullAddress);
                                // status: 0=None, 1=Pending, 2=Approved, 3=Rejected
                                if (request.status === 1) setRegistrationStatus('pending');
                                else if (request.status === 3) setRegistrationStatus('rejected');
                                else setRegistrationStatus('none');
                              } catch(e) {
                                  // La fonction insurerRequests peut ne pas exister sur une vieille version du contrat
                                  console.log("Impossible de lire le statut de la demande");
                              }
                          }

                      } catch (error) {
                          console.error("Erreur vérification Whitelist On-Chain:", error);
                          setIsInsurerWhitelisted(false);
                      }
                  } else {
                      // VERIFICATION LOCALE (MODE SIMULATION)
                      // On utilise le tableau JS hardcodé pour le whitelist
                      const isLocalListed = INSURER_WHITELIST_LOCAL.includes(userFullAddress.toLowerCase());
                      if (isLocalListed) {
                          setIsInsurerWhitelisted(true);
                          setRegistrationStatus('approved');
                      } else {
                          // CORRECTION : Utilisation de localStorage pour le partage cross-files (simili DB)
                          // Récupérer la liste globale des requêtes
                          const storedRequests = localStorage.getItem('moeba_insurer_requests');
                          if (storedRequests) {
                              try {
                                  const requests = JSON.parse(storedRequests);
                                  const myRequest = requests.find(r => r.address.toLowerCase() === userFullAddress.toLowerCase());

                                  if (myRequest) {
                                      if (myRequest.status === 2) { // 2 = Approved
                                           setIsInsurerWhitelisted(true);
                                           setRegistrationStatus('approved');
                                      } else if (myRequest.status === 1) { // 1 = Pending
                                           setIsInsurerWhitelisted(false);
                                           setRegistrationStatus('pending');
                                      } else if (myRequest.status === 3) { // 3 = Rejected
                                           setIsInsurerWhitelisted(false);
                                           setRegistrationStatus('rejected');
                                      }
                                  } else {
                                      setIsInsurerWhitelisted(false);
                                      setRegistrationStatus('none');
                                  }
                              } catch(e) {
                                  console.error("Erreur parsing requests", e);
                              }
                          } else {
                              setIsInsurerWhitelisted(false);
                              setRegistrationStatus('none');
                          }
                      }
                  }
              };

              checkWhitelistStatus();
          }, [walletConnected, userFullAddress, isLiveMode]);


          // --- EFFET DE RECUPERATION DU SOLDE TOKEN SPECIFIQUE ---
          useEffect(() => {
            const fetchAssetBalance = async () => {
                if (!walletConnected || !selectedVault || !window.ethereum) {
                    setAssetBalance(0);
                    setAssetBalanceFormatted('0.00');
                    return;
                }
                try {
                    const provider = new window.ethers.providers.Web3Provider(window.ethereum);
                    const assetSymbol = selectedVault.asset;
                    const chainName = selectedVault.chain;
                    const tokenAddress = TOKEN_MAP[chainName] ? TOKEN_MAP[chainName][assetSymbol] : null;

                    let balance = window.ethers.BigNumber.from(0);
                    let decimals = 18;

                    if (tokenAddress) {
                        const contract = new window.ethers.Contract(tokenAddress, ERC20_ABI, provider);
                        balance = await contract.balanceOf(userFullAddress);
                        try { decimals = await contract.decimals(); } catch(e) {}
                    } else if (assetSymbol === 'ETH' && chainName === 'Ethereum') {
                        balance = await provider.getBalance(userFullAddress);
                    }
                    const formatted = window.ethers.utils.formatUnits(balance, decimals);
                    setAssetBalance(parseFloat(formatted));
                    setAssetBalanceFormatted(parseFloat(formatted).toFixed(4));
                } catch (err) {
                    setAssetBalance(0);
                    setAssetBalanceFormatted('0.0000');
                }
            };
            fetchAssetBalance();
          }, [selectedVault, walletConnected, userFullAddress]);


          useEffect(() => {
            const isDark = document.documentElement.classList.contains('dark');
            setIsDarkMode(isDark);
            if (window.ethereum) {
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length > 0) {
                        const addr = accounts[0];
                        setUserFullAddress(addr);
                        setUserAddress(`${addr.substring(0, 6)}...${addr.substring(addr.length - 4)}`);
                        showNotification("Compte changé détecté", 'info');
                    } else {
                        setWalletConnected(false);
                        setUserAddress('');
                        setUserFullAddress('');
                        showNotification("Wallet déconnecté", 'info');
                    }
                });
            }
          }, []);

          const toggleTheme = () => {
            if (isDarkMode) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                setIsDarkMode(false);
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                setIsDarkMode(true);
            }
          };

          const [newVaultData, setNewVaultData] = useState({
            name: '',
            description: '',
            cap: 40000000,
            coverage: 40000000,
            juniorPercent: 10,
            junior: 4000000,
            premium: 330000,
            // START DATE FIELDS
            startDay: '',
            startMonth: 'Janvier',
            startYear: new Date().getFullYear(),
            // MATURITY DATE FIELDS
            day: '',
            month: 'Janvier',
            year: new Date().getFullYear() + 1,
            chain: 'Base',
            asset: 'USDC'
          });

          const [isOvercollateralized, setIsOvercollateralized] = useState(false);

          // --- GESTION DES FILTRES INVESTISSEUR ---
          const toggleChainFilter = (chain) => {
              if (selectedChains.includes(chain)) {
                  setSelectedChains(selectedChains.filter(c => c !== chain));
              } else {
                  setSelectedChains([...selectedChains, chain]);
              }
          };

          const parseDateForSort = (dateStr) => {
              if (!dateStr || dateStr === "En attente") return new Date(9999, 11, 31);
              const d = parseFrenchDate(dateStr);
              return d || new Date();
          };

          const filteredVaults = vaults.filter(vault => {
              if (selectedChains.length > 0 && !selectedChains.includes(vault.chain)) return false;
              if (searchQuery) {
                  const q = searchQuery.toLowerCase();
                  return vault.asset.toLowerCase().includes(q) || vault.name.toLowerCase().includes(q);
              }
              return true;
          }).sort((a, b) => {
              if (aprSort !== 'neutral') {
                  const valA = parseFloat(a.apr);
                  const valB = parseFloat(b.apr);
                  return aprSort === 'desc' ? valB - valA : valA - valB;
              }
              if (maturitySort !== 'neutral') {
                  const dateA = parseDateForSort(a.maturityDate);
                  const dateB = parseDateForSort(b.maturityDate);
                  return maturitySort === 'asc' ? dateA - dateB : dateB - dateA;
              }
              return 0;
          });

          const toggleAprSort = () => {
              setMaturitySort('neutral');
              if (aprSort === 'neutral') setAprSort('desc');
              else if (aprSort === 'desc') setAprSort('asc');
              else setAprSort('neutral');
          };

          const toggleMaturitySort = () => {
              setAprSort('neutral');
              if (maturitySort === 'neutral') setMaturitySort('asc');
              else if (maturitySort === 'asc') setMaturitySort('desc');
              else setMaturitySort('neutral');
          };

          // --- CONNEXION WALLET ---
          const openWalletSelector = () => { setShowWalletSelector(true); setShowOtherWallets(false); };

          const handleWalletSelect = async (walletType) => {
             setShowWalletSelector(false);
             if (!window.ethers) { showNotification("Erreur technique : Librairie Web3 non chargée.", 'error'); return; }
             let providerInput = null;
             if (walletType === 'zerion') providerInput = window.zerionWallet || (window.ethereum && window.ethereum.isZerion ? window.ethereum : window.ethereum);
             else if (walletType === 'rabby') providerInput = (window.ethereum && window.ethereum.isRabby) ? window.ethereum : window.ethereum;
             else if (walletType === 'metamask') providerInput = window.ethereum;
             else if (walletType === 'walletconnect') providerInput = window.ethereum; // Mock
             else providerInput = window.ethereum;

             if (!providerInput) { showNotification("Aucun wallet compatible détecté.", 'error'); return; }

             try {
                  const accounts = await providerInput.request({ method: 'eth_requestAccounts' });
                  if (!accounts || accounts.length === 0) { showNotification("Aucun compte sélectionné.", 'error'); return; }
                  const provider = new window.ethers.providers.Web3Provider(providerInput);
                  const signer = provider.getSigner();
                  const address = await signer.getAddress();
                  const messageToSign = `Connexion Mœba Protocol\n\nWallet: ${address}\nNonce: ${Date.now()}`;
                  // await signer.signMessage(messageToSign); // Commenté pour rapidité démo

                  const balanceBig = await provider.getBalance(address);
                  const balanceFmt = window.ethers.utils.formatEther(balanceBig);

                  setUserAddress(shortAddress);

          // --- GESTION ENREGISTREMENT ASSUREUR (SYSTEME ORIGINAL REPRIS) ---
          const handleInsurerRegistration = async (data) => {
              setIsRegistering(true);

              if (isLiveMode) {
                  try {
                      const provider = new window.ethers.providers.Web3Provider(window.ethereum);
                      const signer = provider.getSigner();

                      // Instance du contrat Factory
                      const factoryContract = new window.ethers.Contract(FACTORY_ADDRESS_LIVE, FACTORY_ABI_EXTENDED, signer);

                      showNotification("Envoi de la demande sur la Blockchain...", 'info');

                      setRegistrationStatus('pending');

          };

          // --- CREATION VAULT ---
          const handleCreateVault = async (e) => {
            e.preventDefault();
            const capVal = parseFloat(newVaultData.cap);
            const premiumVal = parseFloat(newVaultData.premium);
            const claimVal = isOvercollateralized ? parseFloat(newVaultData.coverage) : capVal;

            if (capVal <= 0) { showNotification("Erreur: La capacité doit être supérieure à 0.", 'error'); return; }
            if (claimVal <= 0) { showNotification("Erreur: Le montant assuré doit être supérieur à 0.", 'error'); return; }

            const monthIndexEnd = MONTHS.findIndex(m => m.name === newVaultData.month);
            const endDate = new Date(newVaultData.year, monthIndexEnd, newVaultData.day);

            // GESTION DATE DEBUT
            const monthIndexStart = MONTHS.findIndex(m => m.name === newVaultData.startMonth);
            const startDate = new Date(newVaultData.startYear, monthIndexStart, newVaultData.startDay);

            if (endDate <= startDate) { showNotification("Erreur: La date de fin doit être après la date de début.", 'error'); return; }
            if (startDate < new Date()) { showNotification("Attention: La date de début est dans le passé.", 'info'); }

            const formattedStartDate = `${newVaultData.startDay} ${newVaultData.startMonth} ${newVaultData.startYear}`;
            const formattedEndDate = `${newVaultData.day} ${newVaultData.month} ${newVaultData.year}`;

            const simulatedRisk = (Math.random() * 19 + 1).toFixed(1);
            const totalCapacityCalculated = capVal + premiumVal;

            const newVault = {
                id: `0x${Math.floor(Math.random()*10000)}...new`,
                name: newVaultData.name || "Nouveau Cat Bond",
                description: newVaultData.description,
                insurer: "Moi (Assureur)",
                totalCapacity: totalCapacityCalculated,
                claimAmount: claimVal,
                currentAssets: 0,
                juniorCapital: parseFloat(newVaultData.junior || 0),
                premium: 0,
                // STOCKAGE DES DEUX DATES
                startDate: formattedStartDate,
                maturityDate: formattedEndDate,
                apr: 0,
                riskProb: simulatedRisk,
                status: "PENDING",
                userBalance: 0,
                triggerValue: 0,
                oracleType: 'WIND',
                chain: newVaultData.chain,
                asset: newVaultData.asset,
                triggers: [{ id: 'windSpeed', name: 'Paramètre', unit: 'unit', color: '#3b82f6' }],

            };

            setNewVaultData({ ...newVaultData, name: '', description: '' });
            setIsOvercollateralized(false);

          const handleInitializeVault = (vaultId) => {
             const premiumValue = parseFloat(newVaultData.premium || 0);
             const updatedVaults = vaults.map(v => {
               if (v.id === vaultId) {
                 // CALCUL DE L'APR SUR LA PERIODE FIXE (StartDate -> MaturityDate)
                 const start = parseFrenchDate(v.startDate);
                 const end = parseFrenchDate(v.maturityDate);

                 // Durée du contrat en jours
                 const diffTime = Math.abs(end - start);
                 const durationInDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 365; // Evite /0

                 return {
                   ...v,
                   status: "OPEN", // Passe en mode souscription
                   premium: premiumValue,
                   currentAssets: v.juniorCapital + premiumValue,
                   // APR FIXE : (Premium / Capital) * (365 / Duration)
                   apr: ((premiumValue * 100 * 365) / ((v.totalCapacity - premiumValue - v.juniorCapital) * durationInDays)).toFixed(2),
                 };
               }
               return v;
             });
             setVaults(updatedVaults);
             showNotification("Vault Initialisé (APR Fixe calculé)", 'success');
          };

          // GESTION DU POURCENTAGE DE DÉPÔT
          const handleSetPercentage = (percent) => {
              if (assetBalance <= 0) return;
              const amount = (assetBalance * percent) / 100;
              const remaining = selectedVault.totalCapacity - selectedVault.currentAssets;
              const finalAmount = amount > remaining ? remaining : amount;
              setDepositAmount(finalAmount.toFixed(4));
          };

          // DEPOT
          const handleDeposit = async () => {
            if (!walletConnected) { showNotification("Connectez votre wallet.", 'error'); return; }
            const amount = parseFloat(depositAmount);
            if (amount <= 0) { showNotification("Montant invalide.", 'error'); return; }

            const updatedVault = {
                 ...selectedVault,
                 currentAssets: selectedVault.currentAssets + amount,
                 userBalance: selectedVault.userBalance + amount
            };
            setSelectedVault(updatedVault);
            setVaults(vaults.map(v => v.id === selectedVault.id ? updatedVault : v));
            showNotification(`Dépôt de ${amount} confirmé.`, 'success');
            setDepositAmount('');
          };

          // RETRAIT (NOUVELLE FONCTION)
          const handleWithdraw = async () => {
             if (!walletConnected) return;
             const amount = parseFloat(withdrawAmount);
             if (amount <= 0 || amount > selectedVault.userBalance) { showNotification("Montant invalide ou solde insuffisant.", 'error'); return; }

             const updatedVault = {
                 ...selectedVault,
                 currentAssets: selectedVault.currentAssets - amount,
                 userBalance: selectedVault.userBalance - amount
            };
            setSelectedVault(updatedVault);
            setVaults(vaults.map(v => v.id === selectedVault.id ? updatedVault : v));
            showNotification(`Retrait de ${amount} effectué.`, 'success');
            setWithdrawAmount('');
          };

          const handleTriggerOracle = (vaultId) => {
            setVaults(vaults.map(v => v.id === vaultId ? { ...v, status: "TRIGGERED" } : v));
            showNotification("⚠️ ORACLE ALERT : Catastrophe validée.", 'error');
          };

          const calculateClaimStats = (vault) => {
              const totalFunds = vault.currentAssets;
              const junior = vault.juniorCapital;
              const premium = vault.premium || 0;
              const riskCapital = totalFunds - premium;
              const senior = Math.max(0, riskCapital - junior);
              const claimNeeded = vault.claimAmount || vault.totalCapacity;
              const juniorPayout = Math.min(junior, claimNeeded);
              const remainingClaim = claimNeeded - juniorPayout;
              const seniorPayout = Math.min(senior, remainingClaim);
              const seniorRemaining = Math.max(0, senior - seniorPayout);
              const recoveryRatio = senior > 0 ? (seniorRemaining / senior) : 0;
              return { recoveryRatio, seniorRemaining };
          };

          const calculatePayoutDetails = (vault) => {
              if (vault.status === 'MATURED') {
                  const principalRecovered = vault.userBalance;
                  const seniorCapacity = vault.totalCapacity - vault.juniorCapital - vault.premium;
                  const userShare = seniorCapacity > 0 ? (vault.userBalance / seniorCapacity) : 0;
                  const yieldPayout = vault.premium * userShare;
                  const rwaYield = vault.userBalance * 0.05;
                  return { principalRecovered, yieldPayout, rwaYield, loss: 0, totalPayout: principalRecovered + yieldPayout + rwaYield };
              }
              const { recoveryRatio } = calculateClaimStats(vault);
              const principalRecovered = vault.userBalance * recoveryRatio;
              const seniorCapacity = vault.totalCapacity - vault.juniorCapital - vault.premium;
              const userShare = seniorCapacity > 0 ? (vault.userBalance / seniorCapacity) : 0;
              const yieldPayout = vault.premium * userShare;
              const rwaYield = vault.userBalance * 0.05;
              return { principalRecovered, yieldPayout, rwaYield, loss: vault.userBalance - principalRecovered, totalPayout: principalRecovered + yieldPayout + rwaYield };
          };

          const handleClaim = (vault) => {
              const details = calculatePayoutDetails(vault);
              showNotification(`Réclamation de ${formatCurrency(details.totalPayout)} versée.`, 'success');
              const updatedVault = { ...vault, userBalance: 0 };
              setSelectedVault(updatedVault);
              setVaults(vaults.map(v => v.id === vault.id ? updatedVault : v));

          const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);

                      <div className="space-y-4">
                        {vaults.map((vault) => (
                          <div key={vault.id} className={`bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 flex flex-col ${!isFormExpanded ? 'md:flex-row' : ''} items-center justify-between gap-6 hover:shadow-md transition-shadow cursor-pointer`}>
                            {/* AFFICHAGE MINIMALISTE QUAND LE FORMULAIRE EST OUVERT */}
                            {isFormExpanded ? (
                                <div className="flex justify-between items-center w-full">
                                    <div className="min-w-0">
                                        <h4 className="font-bold text-slate-900 dark:text-white truncate">{vault.name}</h4>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 font-mono truncate">{vault.id}</p>
                                    </div>
                                    <div className="shrink-0 ml-2">
                                        {vault.status === 'PENDING' && <span className="px-2.5 py-1 bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-xs font-bold rounded-md">PENDING</span>}
                                        {vault.status === 'OPEN' && <span className="px-2.5 py-1 bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-400 text-xs font-bold rounded-md">ACTIVE</span>}
                                        {vault.status === 'MATURED' && <span className="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-400 text-xs font-bold rounded-md">DONE</span>}
                                        {vault.status === 'TRIGGERED' && <span className="px-2.5 py-1 bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-400 text-xs font-bold rounded-md">CRASH</span>}
                                    </div>
                                </div>
                            ) : (
                                /* AFFICHAGE COMPLET QUAND LE FORMULAIRE EST FERMÉ */
                                <>
                                    <div className="flex-1">
                                      <div className="flex items-center gap-3 mb-2">
                                        <h4 className="text-lg font-bold text-slate-900 dark:text-white">{vault.name}</h4>
                                        {vault.status === 'PENDING' && <span className="px-2.5 py-1 bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-xs font-bold rounded-md">PENDING</span>}
                                        {vault.status === 'OPEN' && <span className="px-2.5 py-1 bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-400 text-xs font-bold rounded-md">ACTIVE</span>}
                                        {vault.status === 'MATURED' && <span className="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-400 text-xs font-bold rounded-md">TERMINÉ</span>}
                                        {vault.status === 'TRIGGERED' && <span className="px-3 py-1 rounded-full text-xs font-bold bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-400 flex items-center gap-1"><AlertTriangle className="h-3 w-3" /> CATASTROPHE</span>}
                                      </div>
                                      <div className="flex gap-6 text-sm text-slate-500 dark:text-slate-400">
                                        <span>Capacité: <strong>{formatCurrency(vault.totalCapacity)}</strong></span>
                                        <span>Junior: <strong>{formatCurrency(vault.juniorCapital)}</strong></span>
                                      </div>
                                      {vault.totalCapacity > (vault.claimAmount || vault.totalCapacity) && (
                                          <div className="mt-2 text-xs text-green-700 dark:text-green-400 font-medium bg-green-50 dark:bg-green-900/30 inline-block px-2 py-1 rounded">
                                              Couverture Max: {formatCurrency(vault.claimAmount)} (Sur-collatéralisé)
                                          </div>
                                      )}
                                    </div>

                                    {vault.status === 'PENDING' ? (
                                      <div className="flex flex-col items-end gap-2 w-full md:w-auto">
                                        <div className="text-right">
                                          <p className="text-xs text-slate-500 dark:text-slate-400 mb-1">Total à financer (Junior + Prime)</p>
                                          <p className="font-bold text-slate-900 dark:text-white">{formatCurrency(vault.juniorCapital + vault.premium)}</p>
                                        </div>
                                        <button
                                          onClick={(e) => { e.stopPropagation(); handleInitializeVault(vault.id); }}
                                          className="w-full md:w-auto px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow-sm"
                                        >
                                          Financer & Ouvrir
                                        </button>
                                      </div>
                                    ) : (
                                      <div className="flex items-center gap-4 bg-slate-50 dark:bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <div className="text-right">
                                          <p className="text-xs text-slate-400 dark:text-slate-500">Fonds levés</p>
                                          <p className="font-bold text-slate-700 dark:text-slate-300">{formatCurrency(vault.currentAssets)}</p>
                                        </div>
                                        <div className="h-8 w-px bg-slate-200 dark:bg-slate-700"></div>
                                        <div className="text-right">
                                          <p className="text-xs text-slate-400 dark:text-slate-500">APR Public</p>
                                          <p className="font-bold text-green-600 dark:text-green-400">{vault.apr}%</p>
                                        </div>
                                      </div>
                                    )}
                                </>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                  )}
                  </>
                )}

                 {/* --- VUE DASHBOARD (RESTAURÉE) --- */}
                 {activeRole === 'dashboard' && (
                  !walletConnected ? (
                      <div className="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6 animate-in fade-in max-w-2xl mx-auto">
                           <div className="p-6 bg-slate-100 dark:bg-slate-800 rounded-full mb-2">
                               <Wallet className="h-20 w-20 text-slate-400 dark:text-slate-500" />
                           </div>
                           <h2 className="text-3xl font-bold text-slate-900 dark:text-white">Accès Dashboard</h2>
                           <p className="text-lg text-slate-500 dark:text-slate-400">
                              Connectez votre portefeuille pour visualiser vos positions et gérer vos investissements.
                           </p>
                           <button
                             onClick={openWalletSelector}
                             className="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-lg hover:shadow-blue-200 dark:hover:shadow-none flex items-center gap-2"
                           >
                             <Wallet className="h-5 w-5" /> Connecter Wallet
                           </button>
                      </div>
                  ) : (
                  <div className="max-w-3xl mx-auto animate-in fade-in duration-500">
                    <div className="text-center mb-10">
                      <div className="w-20 h-20 bg-green-50 dark:bg-green-900/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-100 dark:border-green-800">
                        <Wallet className="h-10 w-10 text-green-600 dark:text-green-400" />
                      </div>
                      <h2 className="text-3xl font-bold text-slate-900 dark:text-white">Portfolio Dashboard</h2>
                      <p className="text-slate-500 dark:text-slate-400 mt-2">Interface de surveillance des positions investies</p>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                      <div className="p-6 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <h3 className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                          <Activity className="h-4 w-4" /> Positions Actives
                        </h3>
                        <span className="flex h-3 w-3 relative">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                      </div>

                      <div className="divide-y divide-slate-100 dark:divide-slate-700">
                        {vaults.filter(v => v.userBalance > 0).map(vault => {

                          // SI LE VAULT EST TERMINÉ AVEC SUCCÈS (MATURED)
                          if (vault.status === 'MATURED') {
                              const details = calculatePayoutDetails(vault);
                              return (
                                  <div key={vault.id} className="p-8 bg-green-50/50 dark:bg-green-900/10 relative overflow-hidden">
                                      <div className="flex justify-between items-start mb-6">
                                          <div>
                                              <h4 className="text-xl font-bold text-green-900 dark:text-green-400 flex items-center gap-2">
                                                  <CheckCircle2 className="h-5 w-5" /> {vault.name}
                                              </h4>
                                              <p className="text-xs font-mono text-green-600 dark:text-green-500 mt-1">{vault.id}</p>
                                          </div>
                                          <span className="px-3 py-1 bg-green-100 dark:bg-green-900/50 rounded-full text-xs font-bold text-green-700 dark:text-green-300 border border-green-200 dark:border-green-600">
                                              SUCCÈS - À RÉCLAMER
                                          </span>
                                      </div>

                                      <div className="bg-white dark:bg-slate-900/50 rounded-xl p-4 border border-green-100 dark:border-green-900/30 mb-6">
                                           <div className="flex justify-between items-center mb-2">
                                              <span className="text-sm text-slate-500 dark:text-slate-400">Solde Initial</span>
                                              <span className="font-mono font-bold text-slate-700 dark:text-slate-300">{formatCurrency(vault.userBalance)}</span>
                                           </div>
                                           <div className="flex justify-between items-center mb-2 text-green-600 dark:text-green-400 text-sm">
                                              <span>Total Gains (Yield)</span>
                                              <span>+ {formatCurrency(details.yieldPayout + details.rwaYield)}</span>
                                           </div>
                                           <div className="h-px bg-slate-100 dark:bg-slate-700 my-2"></div>
                                           <div className="flex justify-between items-center">
                                              <span className="font-bold text-slate-900 dark:text-white">Total Disponible</span>
                                              <span className="font-mono text-xl font-bold text-green-600 dark:text-green-400">{formatCurrency(details.totalPayout)}</span>
                                           </div>
                                      </div>

                                      <button
                                         onClick={() => handleClaim(vault)}
                                         className="w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-lg shadow-green-200 dark:shadow-none transition-all flex justify-center items-center gap-2"
                                      >
                                         <Coins className="h-5 w-5" /> Récupérer Gains & Capital
                                      </button>
                                  </div>
                              );
                          }

                          // SI LE VAULT EST EN ETAT DE CATASTROPHE (TRIGGERED)
                          if (vault.status === 'TRIGGERED') {
                              const details = calculatePayoutDetails(vault);
                              return (
                                  <div key={vault.id} className="p-8 bg-red-50/50 dark:bg-red-900/10 relative overflow-hidden">
                                      <div className="flex justify-between items-start mb-6">
                                          <div>
                                              <h4 className="text-xl font-bold text-red-900 dark:text-red-400 flex items-center gap-2">
                                                  <AlertTriangle className="h-5 w-5" /> {vault.name}
                                              </h4>
                                              <p className="text-xs font-mono text-red-400 dark:text-red-500 mt-1">{vault.id}</p>
                                          </div>
                                          <span className="px-3 py-1 bg-red-100 dark:bg-red-900/50 rounded-full text-xs font-bold text-red-600 dark:text-red-300 border border-red-200 dark:border-red-600">
                                              SINISTRE CONFIRMÉ
                                          </span>
                                      </div>

                                      <div className="bg-white dark:bg-slate-900/50 rounded-xl p-4 border border-red-100 dark:border-red-900/30 mb-6">
                                           <div className="flex justify-between items-center mb-2">
                                              <span className="text-sm text-slate-500 dark:text-slate-400">Solde Initial</span>
                                              <span className="font-mono font-bold text-slate-700 dark:text-slate-300">{formatCurrency(vault.userBalance)}</span>
                                           </div>
                                           <div className="flex justify-between items-center mb-2 text-red-600 dark:text-red-400 text-sm">
                                              <span>Perte estimée</span>
                                              <span>- {formatCurrency(details.loss)}</span>
                                           </div>
                                           <div className="h-px bg-slate-100 dark:bg-slate-700 my-2"></div>
                                           <div className="flex justify-between items-center">
                                              <span className="font-bold text-slate-900 dark:text-white">Reste à réclamer</span>
                                              <span className="font-mono text-xl font-bold text-green-600 dark:text-green-400">{formatCurrency(details.totalPayout)}</span>
                                           </div>
                                      </div>

                                      <button
                                         onClick={() => handleClaim(vault)}
                                         className="w-full px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold shadow-lg shadow-red-200 dark:shadow-none transition-all flex justify-center items-center gap-2"
                                      >
                                         <Coins className="h-5 w-5" /> Réclamer les fonds restants
                                      </button>
                                  </div>
                              );
                          }

                          // SINON AFFICHAGE STANDARD (OPEN)
                          return (
                              <div key={vault.id} className="p-8">
                                <div className="flex justify-between items-start mb-6">
                                  <div>
                                    <h4 className="text-xl font-bold text-slate-900 dark:text-white">{vault.name}</h4>
                                    <p className="text-xs font-mono text-slate-400 dark:text-slate-500 mt-1">{vault.id}</p>
                                  </div>
                                  <div className="flex flex-col items-end gap-1">
                                    <div className="px-3 py-1 bg-green-100 dark:bg-green-900/50 rounded-full text-xs font-bold text-green-600 dark:text-green-300 border border-green-200 dark:border-green-600">
                                        INVESTISSEMENT ACTIF
                                    </div>
                                    <span className="text-xs font-medium text-slate-400 dark:text-slate-500">APR: {vault.apr}%</span>
                                  </div>
                                </div>

                                <div className="grid grid-cols-2 gap-6 mb-8">
                                  <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                    <p className="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Montant Investi</p>
                                    <p className="text-2xl font-mono font-bold text-slate-900 dark:text-white">
                                      {formatCurrency(vault.userBalance)} <span className="text-sm font-sans font-normal text-slate-500 dark:text-slate-400">{vault.asset}</span>
                                    </p>
                                  </div>
                                  <div className="bg-white dark:bg-slate-900/30 p-4 rounded-xl border-2 border-green-100 dark:border-green-800 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-2 opacity-10">
                                      <Coins className="h-16 w-16 text-green-600 dark:text-green-400" />
                                    </div>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Valeur Estimée (Fin)</p>
                                    <p className="text-2xl font-mono font-bold text-green-600 dark:text-green-400">
                                      {formatCurrency(vault.userBalance * (1 + (parseFloat(vault.apr)/100) * (calculateDaysRemaining(vault.maturityDate)/365)))}
                                    </p>
                                  </div>
                                </div>

                                <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                                   <button
                                      onClick={() => { setActiveRole('investor'); setSelectedVault(vault); }}
                                      className="w-full px-6 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-green-500 dark:hover:border-green-500 text-slate-900 dark:text-white rounded-lg font-bold transition-all shadow-sm hover:shadow-md flex justify-center items-center gap-2"
                                    >
                                      VOIR DÉTAILS & GÉRER
                                    </button>
                                </div>
                              </div>
                          );
                        })}

                        {vaults.filter(v => v.userBalance > 0).length === 0 && (
                          <div className="p-12 text-center">
                            <p className="text-slate-400 dark:text-slate-500 mb-2">Aucun investissement actif.</p>
                            <button onClick={() => setActiveRole('investor')} className="text-green-600 dark:text-green-400 hover:underline text-sm">
                              Explorer les opportunités
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                  )
                )}

                 {/* --- VUE ORACLE (RESTAURÉE) --- */}
                 {activeRole === 'oracle' && (
                  <div className="max-w-3xl mx-auto animate-in fade-in duration-500">
                    <div className="text-center mb-10">
                      <div className="w-20 h-20 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-100 dark:border-red-800">
                        <Wind className="h-10 w-10 text-red-600 dark:text-red-400" />
                      </div>
                      <h2 className="text-3xl font-bold text-slate-900 dark:text-white">Oracle Dashboard</h2>
                      <p className="text-slate-500 dark:text-slate-400 mt-2">Interface de surveillance des triggers paramétriques</p>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                      <div className="p-6 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <h3 className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                          <Activity className="h-4 w-4" /> Flux de Données en Temps Réel
                        </h3>
                        <span className="flex h-3 w-3 relative">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                      </div>

                      <div className="divide-y divide-slate-100 dark:divide-slate-700">
                        {vaults.filter(v => v.status === 'OPEN').map(vault => (
                          <div key={vault.id} className="p-8">
                            <div className="flex justify-between items-start mb-6">
                              <div>
                                <h4 className="text-xl font-bold text-slate-900 dark:text-white">{vault.name}</h4>
                                <p className="text-xs font-mono text-slate-400 dark:text-slate-500 mt-1">{vault.id}</p>
                              </div>
                              <div className="flex flex-col items-end gap-1">
                                <div className="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-full text-xs font-bold text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600">
                                    MONITORING ACTIVE
                                </div>
                                <span className="text-xs font-medium text-slate-400 dark:text-slate-500">Modèle de Risque: {vault.riskProb}%</span>
                              </div>
                            </div>

                            <div className="grid grid-cols-2 gap-6 mb-8">
                              <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                <p className="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Seuil de Déclenchement</p>
                                <p className="text-2xl font-mono font-bold text-slate-900 dark:text-white">
                                  {vault.triggerValue} <span className="text-sm font-sans font-normal text-slate-500 dark:text-slate-400">unités</span>
                                </p>
                              </div>
                              <div className="bg-white dark:bg-slate-900/30 p-4 rounded-xl border-2 border-green-100 dark:border-green-800 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-2 opacity-10">
                                  <Activity className="h-16 w-16 text-green-600 dark:text-green-400" />
                                </div>
                                <p className="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Donnée Capteur (Live)</p>
                                <p className="text-2xl font-mono font-bold text-green-600 dark:text-green-400">
                                  {Math.floor(vault.triggerValue * 0.2)} <span className="text-sm font-sans font-normal text-slate-400 dark:text-slate-500">/ {vault.triggerValue}</span>
                                </p>
                              </div>
                            </div>

                            <div className="border-t border-slate-100 dark:border-slate-700 pt-6">
                              <div className="flex items-center gap-4 p-4 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-xl">
                                <div className="p-2 bg-white dark:bg-slate-800 rounded-full border border-red-100 dark:border-red-900 shadow-sm">
                                  <AlertTriangle className="h-6 w-6 text-red-600 dark:text-red-400" />
                                </div>
                                <div className="flex-1">
                                  <p className="font-bold text-red-900 dark:text-red-300">Zone de Test (Simulation)</p>
                                  <p className="text-xs text-red-700 dark:text-red-400">
                                    Simuler une catastrophe envoie une transaction `triggerCatastrophe()` au Smart Contract.
                                  </p>
                                </div>
                                <button
                                  onClick={() => handleTriggerOracle(vault.id)}
                                  className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold shadow-lg shadow-red-200 dark:shadow-none transition-all active:scale-95"
                                >
                                  SIMULER CRASH
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}

                        {vaults.filter(v => v.status === 'OPEN').length === 0 && (
                          <div className="p-12 text-center">
                            <p className="text-slate-400 dark:text-slate-500 mb-2">Aucun vault actif à surveiller.</p>
                            <button onClick={() => setActiveRole('insurer')} className="text-blue-600 dark:text-blue-400 hover:underline text-sm">
                              Créer un vault en tant qu'assureur
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
